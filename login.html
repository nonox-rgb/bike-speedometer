<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>VéloCom — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #e02020;
      --accent-glow: rgba(224,32,32,0.35);
      --accent-dim: rgba(224,32,32,0.12);
      --bg: #000;
      --bg2: #0a0a0a;
      --bg3: #111;
      --text: #fff;
      --text-dim: rgba(255,255,255,0.45);
      --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    #page {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 0;
      position: relative;
    }

    /* Background subtle */
    #page::before {
      content: '';
      position: absolute;
      bottom: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(224,32,32,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }
    .logo-img {
      width: 80px; height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .logo-title {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .logo-title span { color: var(--accent); }
    .logo-sub {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-dim), rgba(224,32,32,0.3), var(--accent-dim), transparent);
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 22px;
    }

    /* Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .input-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .input-field {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: rgba(255,255,255,0.2); font-weight: 400; }

    /* Error */
    #error-msg {
      font-size: 12px;
      color: var(--accent);
      text-align: center;
      min-height: 18px;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      color: white;
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px var(--accent-glow);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }

    .btn-primary .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }

    .btn-register {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-register:active { border-color: var(--accent); color: var(--accent); }

    .forgot-link {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .forgot-link:active { color: var(--accent); }
  </style>
</head>
<body>
  <div id="page">
    <div class="logo-wrap">
      <img class="logo-img" src="icon-512.png" alt="VéloCom" onerror="this.style.display='none'" />
      <div class="logo-title">Vélo<span>Com</span></div>
      <div class="logo-sub">Votre trajet, vos données</div>
    </div>

    <div class="card">
      <div class="card-title">Connexion</div>

      <div class="input-group">
        <div class="input-label">Email</div>
        <input class="input-field" type="email" id="email" placeholder="ton@email.com" autocomplete="email" />
      </div>

      <div class="input-group">
        <div class="input-label">Mot de passe</div>
        <input class="input-field" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="error-msg"></div>

      <button class="btn-primary" id="login-btn" onclick="doLogin()">
        <span class="btn-text">Se connecter</span>
        <div class="spinner"></div>
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">PAS DE COMPTE ?</div>
        <div class="divider-line"></div>
      </div>

      <button class="btn-register" onclick="window.location.href='register.html'">Créer un compte</button>

      <div class="forgot-link" onclick="doForgot()">Mot de passe oublié ?</div>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { FIREBASE_CONFIG } from "./firebase-config.js";

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    window.doLogin = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error-msg');

      if (!email || !password) { err.textContent = 'Remplis tous les champs.'; return; }

      btn.classList.add('loading');
      btn.disabled = true;
      err.textContent = '';

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        localStorage.setItem('velocom_user', JSON.stringify({
          uid: cred.user.uid,
          email: cred.user.email,
          displayName: cred.user.displayName,
        }));
        window.location.href = 'index.html';
      } catch(e) {
        btn.classList.remove('loading');
        btn.disabled = false;
        err.textContent = firebaseError(e.code);
      }
    };

    window.doForgot = async function() {
      const email = document.getElementById('email').value.trim();
      const err = document.getElementById('error-msg');
      if (!email) { err.textContent = 'Entre ton email d\'abord.'; return; }
      try {
        await sendPasswordResetEmail(auth, email);
        err.style.color = '#00c3ff';
        err.textContent = 'Email de réinitialisation envoyé !';
      } catch(e) {
        err.style.color = 'var(--accent)';
        err.textContent = firebaseError(e.code);
      }
    };

    // Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    function firebaseError(code) {
      const map = {
        'auth/invalid-email': 'Email invalide.',
        'auth/user-not-found': 'Aucun compte avec cet email.',
        'auth/wrong-password': 'Mot de passe incorrect.',
        'auth/invalid-credential': 'Email ou mot de passe incorrect.',
        'auth/too-many-requests': 'Trop de tentatives. Réessaie plus tard.',
        'auth/network-request-failed': 'Pas de connexion internet.',
      };
      return map[code] || 'Erreur : ' + code;
    }
  </script>
</body>
</html>
