<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>VéloCom — Trajets</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #00c3ff;
      --accent-glow: rgba(0,195,255,0.3);
      --accent-dim: rgba(0,195,255,0.1);
      --bg: #000; --bg2: #0a0a0a; --bg3: #111;
      --text: #fff; --text-dim: rgba(255,255,255,0.45);
      --border: rgba(255,255,255,0.07);
      --red: #e02020;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; }

    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    /* Top bar */
    #topbar {
      display: flex; align-items: center;
      padding: 14px 16px 10px;
      gap: 12px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border); border-radius: 9px;
      background: var(--bg3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--text-dim);
    }
    .back-btn:active { border-color: var(--accent); color: var(--accent); }
    #topbar-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--text-dim); flex: 1;
    }
    #ride-count {
      font-size: 11px; font-weight: 600;
      letter-spacing: 1px; color: var(--accent);
      background: var(--accent-dim);
      padding: 4px 10px; border-radius: 20px;
    }

    /* Stats summary */
    #summary {
      display: flex; gap: 8px;
      padding: 12px 14px;
      flex-shrink: 0;
    }
    .sum-card {
      flex: 1; background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px;
      position: relative; overflow: hidden;
    }
    .sum-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    }
    .sum-label { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
    .sum-value { font-family: 'Orbitron', monospace; font-size: 17px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
    .sum-unit { font-size: 10px; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-weight: 400; }

    /* Rides list */
    #rides-scroll {
      flex: 1; overflow-y: auto;
      padding: 0 14px 20px;
      -webkit-overflow-scrolling: touch;
    }
    #rides-scroll::-webkit-scrollbar { display: none; }

    /* Loading */
    #loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; gap: 14px;
      color: var(--text-dim);
    }
    .load-spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    #empty-state {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; gap: 12px; text-align: center;
    }
    .empty-icon { font-size: 40px; filter: grayscale(1); opacity: 0.4; }
    .empty-title { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
    .empty-sub { font-size: 13px; color: rgba(255,255,255,0.25); line-height: 1.5; }

    /* Month separator */
    .month-sep {
      font-size: 10px; font-weight: 600;
      letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      padding: 16px 0 8px;
    }

    /* Ride card */
    .ride-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      position: relative; overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .ride-card:active { border-color: var(--accent); }
    .ride-card::before {
      content: ''; position: absolute;
      left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent);
      border-radius: 3px 0 0 3px;
      opacity: 0.6;
    }

    .ride-top {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .ride-date { font-size: 13px; font-weight: 600; color: var(--text); }
    .ride-time { font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.5px; }
    .ride-duration {
      font-family: 'Orbitron', monospace;
      font-size: 11px; font-weight: 700;
      color: var(--accent); letter-spacing: 1px;
      background: var(--accent-dim);
      padding: 3px 9px; border-radius: 20px;
    }

    .ride-stats {
      display: flex; gap: 0;
    }
    .ride-stat {
      flex: 1;
      border-right: 1px solid var(--border);
      padding-right: 12px; margin-right: 12px;
    }
    .ride-stat:last-child { border-right: none; padding-right: 0; margin-right: 0; }
    .ride-stat-label { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
    .ride-stat-value { font-family: 'Orbitron', monospace; font-size: 16px; font-weight: 700; line-height: 1.2; margin-top: 1px; }
    .ride-stat-unit { font-size: 9px; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; }

    /* Delete swipe hint */
    .ride-delete {
      position: absolute; right: 14px; bottom: 14px;
      font-size: 11px; color: rgba(255,255,255,0.15);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="back-btn" onclick="window.location.href='index.html'">←</div>
      <div id="topbar-title">Mes trajets</div>
      <div id="ride-count">0 trajet</div>
    </div>

    <div id="summary">
      <div class="sum-card">
        <div class="sum-label">Distance totale</div>
        <div class="sum-value" id="sum-dist">0.0<span class="sum-unit"> km</span></div>
      </div>
      <div class="sum-card">
        <div class="sum-label">Vitesse max</div>
        <div class="sum-value" id="sum-max">0.0<span class="sum-unit"> km/h</span></div>
      </div>
      <div class="sum-card">
        <div class="sum-label">Trajets</div>
        <div class="sum-value" id="sum-count">0</div>
      </div>
    </div>

    <div id="rides-scroll">
      <div id="loading">
        <div class="load-spinner"></div>
        <span style="font-size:12px;letter-spacing:2px;text-transform:uppercase;">Chargement...</span>
      </div>
      <div id="empty-state">
        <div class="empty-icon">🚴</div>
        <div class="empty-title">Aucun trajet</div>
        <div class="empty-sub">Tes trajets apparaîtront ici<br>après ta première sortie.</div>
      </div>
      <div id="rides-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { FIREBASE_CONFIG } from "./firebase-config.js";

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = 'login.html'; return; }
      loadRides(user.uid);
    });

    async function loadRides(uid) {
      try {
        const q = query(
          collection(db, 'rides'),
          where('uid', '==', uid),
          orderBy('startedAt', 'desc')
        );
        const snap = await getDocs(q);
        const rides = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderRides(rides);
      } catch(e) {
        document.getElementById('loading').innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:12px;letter-spacing:1px;">Erreur de chargement</div>';
      }
    }

    function renderRides(rides) {
      document.getElementById('loading').style.display = 'none';
      const list = document.getElementById('rides-list');

      if (rides.length === 0) {
        document.getElementById('empty-state').style.display = 'flex';
        return;
      }

      // Summary stats
      const totalDist = rides.reduce((a, r) => a + (r.distance || 0), 0);
      const maxSpeed = Math.max(...rides.map(r => r.maxSpeed || 0));
      document.getElementById('sum-dist').innerHTML = totalDist.toFixed(1) + '<span class="sum-unit"> km</span>';
      document.getElementById('sum-max').innerHTML = maxSpeed.toFixed(1) + '<span class="sum-unit"> km/h</span>';
      document.getElementById('sum-count').textContent = rides.length;
      const countEl = document.getElementById('ride-count');
      countEl.textContent = rides.length + ' trajet' + (rides.length > 1 ? 's' : '');

      // Group by month
      let lastMonth = '';
      rides.forEach(ride => {
        const date = new Date(ride.startedAt);
        const month = date.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        const monthCap = month.charAt(0).toUpperCase() + month.slice(1);

        if (monthCap !== lastMonth) {
          lastMonth = monthCap;
          const sep = document.createElement('div');
          sep.className = 'month-sep';
          sep.textContent = monthCap;
          list.appendChild(sep);
        }

        list.appendChild(makeRideCard(ride));
      });
    }

    function makeRideCard(ride) {
      const card = document.createElement('div');
      card.className = 'ride-card';

      const date = new Date(ride.startedAt);
      const dateStr = date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      const dateStrCap = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
      const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const duration = formatDuration(ride.duration || 0);

      card.innerHTML = `
        <div class="ride-top">
          <div>
            <div class="ride-date">${dateStrCap}</div>
            <div class="ride-time">${timeStr}</div>
          </div>
          <div class="ride-duration">${duration}</div>
        </div>
        <div class="ride-stats">
          <div class="ride-stat">
            <div class="ride-stat-label">Distance</div>
            <div class="ride-stat-value">${(ride.distance || 0).toFixed(2)}<span class="ride-stat-unit"> km</span></div>
          </div>
          <div class="ride-stat">
            <div class="ride-stat-label">Moyenne</div>
            <div class="ride-stat-value">${(ride.avgSpeed || 0).toFixed(1)}<span class="ride-stat-unit"> km/h</span></div>
          </div>
          <div class="ride-stat">
            <div class="ride-stat-label">Max</div>
            <div class="ride-stat-value">${(ride.maxSpeed || 0).toFixed(1)}<span class="ride-stat-unit"> km/h</span></div>
          </div>
        </div>
      `;

      // Long press to delete
      let pressTimer;
      card.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => confirmDelete(ride.id, card), 700);
      });
      card.addEventListener('touchend', () => clearTimeout(pressTimer));
      card.addEventListener('touchmove', () => clearTimeout(pressTimer));

      return card;
    }

    async function confirmDelete(id, card) {
      if (!confirm('Supprimer ce trajet ?')) return;
      try {
        await deleteDoc(doc(db, 'rides', id));
        card.style.transition = 'opacity 0.3s, transform 0.3s';
        card.style.opacity = '0';
        card.style.transform = 'translateX(20px)';
        setTimeout(() => { card.remove(); location.reload(); }, 300);
      } catch(e) { alert('Erreur suppression'); }
    }

    function formatDuration(seconds) {
      if (!seconds) return '0:00';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return `${h}h${m.toString().padStart(2,'0')}`;
      return `${m}:${s.toString().padStart(2,'0')}`;
    }
  </script>
</body>
</html>
