<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>VéloCom — Inscription</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #e02020;
      --accent-glow: rgba(224,32,32,0.35);
      --accent-dim: rgba(224,32,32,0.12);
      --bg: #000;
      --bg2: #0a0a0a;
      --bg3: #111;
      --text: #fff;
      --text-dim: rgba(255,255,255,0.45);
      --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-y: auto;
    }
    #page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      position: relative;
    }
    #page::before {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(224,32,32,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .back-btn {
      position: absolute;
      top: 20px; left: 20px;
      width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: rgba(255,255,255,0.5);
      transition: all 0.2s;
    }
    .back-btn:active { border-color: var(--accent); color: var(--accent); }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }
    .logo-img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 8px; }
    .logo-title { font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; letter-spacing: 2px; }
    .logo-title span { color: var(--accent); }

    .card {
      width: 100%; max-width: 360px;
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px 24px;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(224,32,32,0.2), rgba(224,32,32,0.4), rgba(224,32,32,0.2), transparent);
    }
    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 22px;
    }

    .input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .input-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    .input-field {
      width: 100%; background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 13px 14px;
      color: #fff; font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 600;
      outline: none; transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: rgba(255,255,255,0.2); font-weight: 400; }

    #error-msg { font-size: 12px; color: var(--accent); text-align: center; min-height: 18px; margin-bottom: 6px; font-weight: 600; }

    .btn-primary {
      width: 100%; padding: 15px;
      border-radius: 12px; background: var(--accent);
      border: none; color: white;
      font-family: 'Orbitron', monospace;
      font-size: 12px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 20px var(--accent-glow);
      margin-top: 8px;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-primary .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto;
    }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .terms {
      margin-top: 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      line-height: 1.5;
    }

    /* Password strength */
    .strength-bar {
      height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.06);
      margin-top: 6px; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 2px;
      width: 0%; transition: width 0.3s, background 0.3s;
    }
  </style>
</head>
<body>
  <div id="page">
    <div class="back-btn" onclick="window.location.href='login.html'">←</div>

    <div class="logo-wrap">
      <img class="logo-img" src="icon-512.png" alt="VéloCom" onerror="this.style.display='none'" />
      <div class="logo-title">Vélo<span>Com</span></div>
    </div>

    <div class="card">
      <div class="card-title">Créer un compte</div>

      <div class="input-group">
        <div class="input-label">Pseudo</div>
        <input class="input-field" type="text" id="username" placeholder="TonPseudo" autocomplete="username" />
      </div>

      <div class="input-group">
        <div class="input-label">Email</div>
        <input class="input-field" type="email" id="email" placeholder="ton@email.com" autocomplete="email" />
      </div>

      <div class="input-group">
        <div class="input-label">Mot de passe</div>
        <input class="input-field" type="password" id="password" placeholder="Min. 6 caractères" autocomplete="new-password" oninput="checkStrength(this.value)" />
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      </div>

      <div class="input-group">
        <div class="input-label">Confirmer le mot de passe</div>
        <input class="input-field" type="password" id="password2" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div id="error-msg"></div>

      <button class="btn-primary" id="reg-btn" onclick="doRegister()">
        <span class="btn-text">Créer mon compte</span>
        <div class="spinner"></div>
      </button>

      <div class="terms">En créant un compte, tu acceptes que tes données de trajet soient stockées sur nos serveurs.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { FIREBASE_CONFIG } from "./firebase-config.js";

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.checkStrength = function(val) {
      const fill = document.getElementById('strength-fill');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      const colors = ['#e02020','#ff6b00','#ffd700','#00c3ff'];
      fill.style.width = (score * 25) + '%';
      fill.style.background = colors[score - 1] || '#333';
    };

    window.doRegister = async function() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const btn = document.getElementById('reg-btn');
      const err = document.getElementById('error-msg');

      if (!username || !email || !password || !password2) { err.textContent = 'Remplis tous les champs.'; return; }
      if (password !== password2) { err.textContent = 'Les mots de passe ne correspondent pas.'; return; }
      if (password.length < 6) { err.textContent = 'Mot de passe trop court (min. 6).'; return; }

      btn.classList.add('loading'); btn.disabled = true; err.textContent = '';

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: username });
        await setDoc(doc(db, 'users', cred.user.uid), {
          username,
          email,
          createdAt: new Date().toISOString(),
        });
        localStorage.setItem('velocom_user', JSON.stringify({
          uid: cred.user.uid,
          email: cred.user.email,
          displayName: username,
        }));
        window.location.href = 'index.html';
      } catch(e) {
        btn.classList.remove('loading'); btn.disabled = false;
        const map = {
          'auth/email-already-in-use': 'Cet email est déjà utilisé.',
          'auth/invalid-email': 'Email invalide.',
          'auth/weak-password': 'Mot de passe trop faible.',
          'auth/network-request-failed': 'Pas de connexion internet.',
        };
        err.textContent = map[e.code] || 'Erreur : ' + e.code;
      }
    };

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
  </script>
</body>
</html>
